services:
  # ============================================
  # MySQL Database
  # ============================================
  db:
    image: mysql:8.0
    container_name: smartlining-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-smartlining}
      MYSQL_USER: ${DB_USER:-smartlining}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smartlining-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ============================================
  # Backend API (Node.js + Express)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartlining-backend
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: mysql://${DB_USER:-smartlining}:${DB_PASSWORD:-password}@db:3306/${DB_NAME:-smartlining}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173,http://localhost:3001,http://192.168.1.142:5173,http://192.168.1.142:8080
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartlining-network
    restart: unless-stopped

  # ============================================
  # Frontend (nginx serving Vite build)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smartlining-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - smartlining-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  smartlining-network:
    driver: bridge
